name: Release

# Push a tag like v0.5.0 to build installers for Windows + Linux and attach
# them to a draft GitHub release (including the auto-updater's latest.json).
# Requires the TAURI_SIGNING_PRIVATE_KEY secret — see docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Feather ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below. Existing installations update themselves."
          releaseDraft: true
          prerelease: false

  # Build the web app (web/dist) and upload it to the storage server's
  # /webroot, so https://<the site> updates together with every release.
  # Skips itself silently when the WEBROOT_* secrets aren't configured.
  deploy-web:
    name: Deploy web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run web:build
      - name: Pack web/dist
        run: tar -czf web.tar.gz -C web/dist .
      - name: Upload to server web root
        env:
          WEBROOT_PANEL_URL: ${{ secrets.WEBROOT_PANEL_URL }}
          WEBROOT_SERVER_ID: ${{ secrets.WEBROOT_SERVER_ID }}
          WEBROOT_API_KEY: ${{ secrets.WEBROOT_API_KEY }}
        run: node scripts/deploy-web.mjs
